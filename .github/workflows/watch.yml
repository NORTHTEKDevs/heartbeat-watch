name: heartbeat-watch
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "send a test alert"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: check heartbeat
        env:
          HB_TOPIC: ${{ secrets.HB_TOPIC }}
          ALERT_TOPIC: ${{ secrets.ALERT_TOPIC }}
          TEST: ${{ inputs.test_alert }}
        run: |
          if [ "$TEST" = "true" ]; then
            curl -fsS -H "Title: Arctic Desk dead-man test" -d "Test alert from the heartbeat watcher. Nothing is wrong." "https://ntfy.sh/$ALERT_TOPIC" >/dev/null
            echo "test alert sent"; exit 0
          fi
          n=$(curl -fsS --max-time 30 "https://ntfy.sh/$HB_TOPIC/json?poll=1&since=25m" | grep -c '"event":"message"' || true)
          echo "heartbeats in the last 25 min: $n"
          if [ "$n" -eq 0 ]; then
            curl -fsS -H "Title: Arctic Desk is DOWN" -H "Priority: high" -H "Tags: rotating_light" \
              -d "No heartbeat from the desk for 25+ minutes: the PC is off, asleep, offline, or the watchdog died. Kraken's own 180 s dead-man cancels resting orders; positions stay as they are." \
              "https://ntfy.sh/$ALERT_TOPIC" >/dev/null
            echo "ALERT sent"
          fi
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: keep the schedule enabled (GitHub disables schedules after 60 quiet days)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "Northtek"; git config user.email "info@northtek.io"
            git commit --allow-empty -m "keepalive" && git push
          fi
